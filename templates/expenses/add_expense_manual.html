{% extends "base.html" %}
{% block title %}Add Expense{% endblock %}

{% block content %}
<div class="breadcrumb">
    <a href="/expenses">Expenses</a>
    <span>›</span> Add Expense
</div>

<div class="page-header">
    <h1>Add Expense</h1>
</div>

{% if error %}
<div class="alert alert-danger">{{ error }}</div>
{% endif %}

<div class="card" style="max-width:600px;">
    <form method="post" action="/expenses/new/manual">
        <div class="form-group">
            <label class="form-label" for="vendor">Vendor</label>
            <input type="text" id="vendor" name="vendor" class="form-control" placeholder="e.g. Target">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label class="form-label" for="amount">Amount</label>
                <input type="number" step="0.01" id="amount" name="amount" class="form-control" placeholder="0.00">
            </div>
            <div class="form-group">
                <label class="form-label" for="expense_date">Date</label>
                <input type="date" id="expense_date" name="expense_date" class="form-control">
            </div>
        </div>

        <div class="form-group">
            <label class="form-label" for="category">Category</label>
            <select id="category" name="category" class="form-control">
                {% for cat in categories %}
                <option value="{{ cat }}">{{ cat }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label class="form-label" for="notes">Notes</label>
            <textarea id="notes" name="notes" class="form-control" rows="3" placeholder="Any extra details..."></textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Expense</button>
            <a href="/expenses" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
