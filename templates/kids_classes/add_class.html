{% extends "base.html" %}
{% block title %}Add Class{% endblock %}

{% block content %}
<div class="breadcrumb">
    <a href="/kids-classes">Kids Classes</a>
    <span>›</span> Add Class
</div>

<div class="page-header">
    <h1>Add Class</h1>
</div>

{% if error %}
<div class="alert alert-danger">{{ error }}</div>
{% endif %}

<div class="card" style="max-width:600px;">
    <form method="post" action="/kids-classes/new">
        <div class="form-group">
            <label class="form-label" for="class_name">Class Name <span class="required">*</span></label>
            <input type="text" id="class_name" name="class_name" class="form-control" placeholder="e.g. Swimming" required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label class="form-label" for="class_date">Date</label>
                <input type="date" id="class_date" name="class_date" class="form-control">
            </div>
            <div class="form-group">
                <label class="form-label" for="class_time">Time</label>
                <input type="text" id="class_time" name="class_time" class="form-control" placeholder="e.g. 4:00 PM">
            </div>
        </div>

        <div class="form-group">
            <label class="form-label" for="recurrence">Recurrence</label>
            <input type="text" id="recurrence" name="recurrence" class="form-control" placeholder="e.g. Every Tuesday">
        </div>

        <div class="form-group">
            <label class="form-label" for="cost_details">Cost Details</label>
            <input type="text" id="cost_details" name="cost_details" class="form-control" placeholder="e.g. $80/month">
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Save Class</button>
            <a href="/kids-classes" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
